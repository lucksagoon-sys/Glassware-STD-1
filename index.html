<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glassware Chase: เกมกล่องคำถามเครื่องแก้ว (Mobile Mode)</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a202c;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden; /* ป้องกันการเลื่อนจอแนวนอน */
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .combo-text { color: #f6e05e; }
        .score-text { color: #68d391; }
        .multiplier-active { color: #fc8181; animation: pulse 1s infinite; }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
        }
        canvas {
            background-color: #2d3748;
            border: 4px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%; /* ให้แคนวาสยืดตามขนาดจอ */
            height: auto;
            touch-action: none; /* ป้องกันการซูมหรือเลื่อนจอเวลาแตะแคนวาส */
        }
        
        /* Modal สำหรับคำถาม */
        #question-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 10;
        }
        .modal-content {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top: 0; color: #2b6cb0; font-size: 1.2rem; }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .choice-btn:active { background-color: #2b6cb0; }
        
        #game-over {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 8px;
            z-index: 10;
        }
        #game-over h1 { color: #f6ad55; font-size: 2rem; margin-bottom: 10px; text-align: center; }
        #game-over button {
            padding: 12px 25px; font-size: 1.1rem;
            background-color: #48bb78; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            margin-top: 20px;
        }

        /* ปุ่มควบคุมบนหน้าจอ (Mobile Controls) */
        #mobile-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
            user-select: none;
        }
        .control-row {
            display: flex;
            gap: 10px;
        }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: manipulation; /* ป้องกันการซูมเมื่อแตะรัวๆ */
            cursor: pointer;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background-color: #3182ce;
            transform: scale(0.95);
        }

        /* ซ่อนปุ่มบนจอคอมพิวเตอร์ที่กว้างมาก */
        @media (min-width: 1024px) {
            #mobile-controls {
                display: none;
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="hud">
        <div id="score-board" class="score-text">คะแนน: 0</div>
        <div id="combo-board" class="combo-text">Combo: 0 (x1)</div>
    </div>

    <div id="game-container">
        <!-- แคนวาสกำหนดขนาดแกนในเป็น 800x600 แต่ CSS จะบีบให้พอดีจอ -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- หน้าต่างคำถาม -->
        <div id="question-modal">
            <div class="modal-content">
                <h3 id="q-text">คำถามจะแสดงที่นี่</h3>
                <div id="choices-container"></div>
            </div>
        </div>

        <!-- หน้าต่างจบเกม -->
        <div id="game-over">
            <h1>🏆 เคลียร์สำเร็จ! 🏆</h1>
            <h2 id="final-score">คะแนนรวม: 0</h2>
            <button onclick="location.reload()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <!-- ปุ่มควบคุมทิศทางสำหรับมือถือ -->
    <div id="mobile-controls">
        <div class="control-row">
            <button class="ctrl-btn" id="btn-up">▲</button>
        </div>
        <div class="control-row">
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-down">▼</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ฐานข้อมูลคำถาม 10 ข้อ
        const questionsData = [
            { q: 'สัญลักษณ์ "In" หรือ "TC" บนเครื่องแก้วหมายถึงอะไร?', choices: ['เครื่องแก้วสำหรับบรรจุ', 'เครื่องแก้วสำหรับถ่ายเท', 'เครื่องแก้วทนความร้อน', 'เครื่องแก้วสำหรับต้ม'], ans: 0 },
            { q: 'สัญลักษณ์ "Ex" หรือ "TD" หมายถึงอะไร?', choices: ['เครื่องแก้วสำหรับบรรจุ', 'เครื่องแก้วสำหรับถ่ายเท', 'เครื่องแก้วทนความร้อน', 'เครื่องแก้วสุญญากาศ'], ans: 1 },
            { q: 'เครื่องแก้ว Class A และ Class B แตกต่างกันอย่างไร?', choices: ['Class A ทำจากพลาสติก', 'Class B แม่นยำกว่า', 'Class A แม่นยำสูงกว่าและคลาดเคลื่อนน้อยกว่า', 'ไม่แตกต่างกันเลย'], ans: 2 },
            { q: 'อุณหภูมิมาตรฐานที่ใช้สอบเทียบเครื่องแก้วคือเท่าใด?', choices: ['15 °C', '20 °C', '25 °C', '30 °C'], ans: 1 },
            { q: 'จุกปิดขวดวัดปริมาตรขนาด 14/23 ตัวเลข 14 หมายถึงอะไร?', choices: ['เส้นผ่านศูนย์กลางด้านในขอบแก้ว', 'ความสูงของข้อต่อ', 'ปริมาตรของขวด', 'ความหนาของแก้ว'], ans: 0 },
            { q: 'ปิเปตต์ชนิดใดที่มีกระเปาะตรงกลางและวัดปริมาตรได้เพียงค่าเดียว?', choices: ['Pasteur Pipette', 'Mohr Pipette', 'Serological Pipette', 'Volumetric Pipette'], ans: 3 },
            { q: 'จุดสังเกตของ Serological Pipette คืออะไร?', choices: ['เป็นท่อตรง ขีดบอกปริมาตรไม่ถึงปลายสุด', 'เป็นท่อตรง ขีดบอกปริมาตรลากยาวถึงปลายสุด', 'มีกระเปาะตรงกลาง', 'ทำจากพลาสติกเท่านั้น'], ans: 1 },
            { q: 'หากบนปิเปตต์มีคำว่า "+5s" หมายความว่าอย่างไร?', choices: ['ใช้เวลาดูดสาร 5 วินาที', 'ต้องรอ 5 วินาทีหลังจากของเหลวหยุดไหลก่อนนำออก', 'ต้องเป่าลมออก 5 วินาที', 'สารละลายจะหมดอายุใน 5 วินาที'], ans: 1 },
            { q: 'อ่านค่าบิวเรตต์ได้ 24.15 ml มี Error Limit ±0.05 ml ปริมาตรจริงจะอยู่ในช่วงใด?', choices: ['24.10 ถึง 24.20 ml', '24.00 ถึง 24.20 ml', '24.10 ถึง 24.30 ml', '24.05 ถึง 24.25 ml'], ans: 0 },
            { q: 'เพื่อลดความคลาดเคลื่อนจากสายตา การอ่านบิวเรตต์นิยมลงท้ายด้วยเลขใด?', choices: ['1 หรือ 9', '2 หรือ 8', '0 หรือ 5', '3 หรือ 7'], ans: 2 }
        ];

        let score = 0;
        let combo = 0;
        let multiplier = 1;
        let isPaused = false;
        let activeBlueBox = null;

        // คอนโทรล (รองรับทั้งคีย์บอร์ดและทัชสกรีน)
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        
        // คีย์บอร์ด
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // ปุ่มสัมผัส (Mobile Controls)
        function bindTouchControl(btnId, keyName) {
            const btn = document.getElementById(btnId);
            // เมื่อกด/แตะ
            const press = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
            // เมื่อปล่อย/ลากออก
            const release = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };
            
            btn.addEventListener('touchstart', press, {passive: false});
            btn.addEventListener('touchend', release);
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        bindTouchControl('btn-up', 'ArrowUp');
        bindTouchControl('btn-down', 'ArrowDown');
        bindTouchControl('btn-left', 'ArrowLeft');
        bindTouchControl('btn-right', 'ArrowRight');

        // ตัวละครผู้เล่น
        const player = { x: 400, y: 300, size: 30, speed: 5, color: '#48bb78', immuneTime: 0 };

        // สร้างกล่องสีน้ำเงิน (คำถาม) 10 กล่อง
        let blueBoxes = [];
        questionsData.forEach((q) => {
            blueBoxes.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                size: 25,
                color: '#3182ce',
                questionData: q
            });
        });

        // สร้างกล่องสีแดง (อุปสรรค) 5 กล่อง
        let redBoxes = [];
        for(let i = 0; i < 5; i++) {
            redBoxes.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                size: 25,
                color: '#e53e3e'
            });
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.size &&
                   rect1.x + rect1.size > rect2.x &&
                   rect1.y < rect2.y + rect2.size &&
                   rect1.y + rect1.size > rect2.y;
        }

        function updateHUD() {
            document.getElementById('score-board').innerText = `คะแนน: ${score}`;
            const comboBoard = document.getElementById('combo-board');
            comboBoard.innerText = `Combo: ${combo} (x${multiplier})`;
            if (multiplier > 1) {
                comboBoard.classList.add('multiplier-active');
            } else {
                comboBoard.classList.remove('multiplier-active');
            }
        }

        function showQuestion(blueBox) {
            isPaused = true;
            activeBlueBox = blueBox;
            const qData = blueBox.questionData;
            
            // ยกเลิกปุ่มทิศทางที่ค้างอยู่ (แก้ปัญหาผู้เล่นวิ่งไม่หยุดหลังตอบคำถาม)
            for(let key in keys) { keys[key] = false; }
            document.querySelectorAll('.ctrl-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('q-text').innerText = qData.q;
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            
            qData.choices.forEach((choice, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => handleAnswer(idx === qData.ans);
                container.appendChild(btn);
            });
            
            document.getElementById('question-modal').style.display = 'flex';
        }

        function handleAnswer(isCorrect) {
            document.getElementById('question-modal').style.display = 'none';
            
            if (isCorrect) {
                score += (1 * multiplier);
                combo++;
                if (combo >= 3) { multiplier = 2; }
                blueBoxes = blueBoxes.filter(b => b !== activeBlueBox);
            } else {
                combo = 0;
                multiplier = 1;
                activeBlueBox.x = Math.random() * (canvas.width - 40) + 20;
                activeBlueBox.y = Math.random() * (canvas.height - 40) + 20;
            }
            
            updateHUD();
            activeBlueBox = null;
            isPaused = false;

            if (blueBoxes.length === 0) {
                document.getElementById('game-over').style.display = 'flex';
                document.getElementById('final-score').innerText = `คะแนนรวม: ${score}`;
                isPaused = true;
            }
        }

        function gameLoop() {
            if (!isPaused) {
                // อัปเดตตำแหน่ง
                let dx = 0, dy = 0;
                if (keys.w || keys.ArrowUp) dy = -player.speed;
                if (keys.s || keys.ArrowDown) dy = player.speed;
                if (keys.a || keys.ArrowLeft) dx = -player.speed;
                if (keys.d || keys.ArrowRight) dx = player.speed;
                
                player.x = Math.max(0, Math.min(canvas.width - player.size, player.x + dx));
                player.y = Math.max(0, Math.min(canvas.height - player.size, player.y + dy));

                if (player.immuneTime > 0) player.immuneTime--;

                // กล่องน้ำเงิน
                blueBoxes.forEach(b => {
                    b.x += b.vx;
                    b.y += b.vy;
                    if (b.x <= 0 || b.x + b.size >= canvas.width) b.vx *= -1;
                    if (b.y <= 0 || b.y + b.size >= canvas.height) b.vy *= -1;
                    if (checkCollision(player, b)) { showQuestion(b); }
                });

                // กล่องแดง
                redBoxes.forEach(r => {
                    r.x += r.vx;
                    r.y += r.vy;
                    if (r.x <= 0 || r.x + r.size >= canvas.width) r.vx *= -1;
                    if (r.y <= 0 || r.y + r.size >= canvas.height) r.vy *= -1;
                    if (player.immuneTime <= 0 && checkCollision(player, r)) {
                        score = Math.max(0, score - 1);
                        combo = 0; 
                        multiplier = 1;
                        player.immuneTime = 120;
                        updateHUD();
                    }
                });
            }

            // วาดกราฟิก
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            blueBoxes.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.size, b.size);
                ctx.fillStyle = 'white';
                ctx.font = '16px Arial';
                ctx.fillText('?', b.x + 8, b.y + 18);
            });

            redBoxes.forEach(r => {
                ctx.fillStyle = r.color;
                ctx.fillRect(r.x, r.y, r.size, r.size);
                ctx.fillStyle = 'white';
                ctx.font = '16px Arial';
                ctx.fillText('!', r.x + 10, r.y + 18);
            });

            if (player.immuneTime === 0 || Math.floor(player.immuneTime / 10) % 2 === 0) {
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x, player.y, player.size, player.size);
            }

            requestAnimationFrame(gameLoop);
        }

        updateHUD();
        gameLoop();
    </script>
</body>
</html>
